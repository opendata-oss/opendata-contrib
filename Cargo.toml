[workspace]
resolver = "2"
members = [
    "connectors/clickhouse-ingestor",
    "connectors/clickhouse-ingestor-bench",
    "plugins/opendata-ingest-clickhouse",
    "plugins/opendata-ingest-otel",
    "runtime/opendata-ingest-runtime",
]

[workspace.package]
version = "0.1.2"
edition = "2024"

[workspace.dependencies]
buffer = { package = "opendata-buffer", version = "0.2.0" }
common = { package = "opendata-common", version = "0.1.14" }

anyhow = "1.0"
async-channel = "2"
async-trait = "0.1"
axum = "0.8"
bytes = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["yaml"] }
futures = { version = "0.3", features = ["std"] }
hex = "0.4"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
metrics-util = "0.20"
opentelemetry-proto = { version = "0.28", default-features = false, features = ["logs", "metrics", "trace", "gen-tonic-messages"] }
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
slatedb = "0.12.0"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full", "test-util"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2.1"

[profile.release]
debug = true
strip = "none"

# Phase 6 dev-only patch (impl-plan row 6.1; phase06 design §Migration
# Plan step 1). Repoints opendata-buffer and opendata-common at the
# unpublished RFC 0003 surface (`next_descriptors`, `fetch_handle`,
# `ack_through`) on the Phase 2 read-ahead-impl branch. Phase 11.2
# (release flip) removes this block once the buffer release lands.
# See `plans/odb-high-throughput/local-development.md` §Cross-Repo
# Path Dependencies.
#
# CI / image-build default: pull from the upstream branch by SHA so
# `build-image.yml` (which has no sibling worktree on the runner)
# succeeds. `opendata-oss/opendata` is public so HTTPS clone works
# without a deploy key.
#
# Update SHA whenever the buffer side lands a change worth picking up.
# Cargo will refetch the git tree on the next build.
[patch.crates-io]
opendata-buffer = { git = "https://github.com/opendata-oss/opendata.git", rev = "39b02fc84cc63c3a3cf05d885864dcdca6e1cc7f" }
opendata-common = { git = "https://github.com/opendata-oss/opendata.git", rev = "39b02fc84cc63c3a3cf05d885864dcdca6e1cc7f" }

# Local-dev alternative — fast iteration against a sibling worktree at
# `worktrees/odb-ht/opendata-2-buffer-readahead-impl/`. To use:
#   1. Comment out the two `git = ...` lines above.
#   2. Uncomment the two `path = ...` lines below.
# Restore the git-rev form before pushing — CI fails on the path form
# because the sibling dir doesn't exist on a runner.
# opendata-buffer = { path = "../opendata-2-buffer-readahead-impl/buffer" }
# opendata-common = { path = "../opendata-2-buffer-readahead-impl/common" }
