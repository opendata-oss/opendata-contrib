[workspace]
resolver = "2"
members = [
    "connectors/clickhouse-ingestor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
buffer = { package = "opendata-buffer", version = "0.2.0" }
common = { package = "opendata-common", version = "0.1.14" }

anyhow = "1.0"
axum = "0.8"
bytes = "1.0"
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["yaml"] }
futures = { version = "0.3", features = ["std"] }
hex = "0.4"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
opentelemetry-proto = { version = "0.28", default-features = false, features = ["logs", "metrics", "gen-tonic-messages"] }
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
slatedb = "0.12.0"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full", "test-util"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2.1"

[profile.release]
debug = true
strip = "none"
